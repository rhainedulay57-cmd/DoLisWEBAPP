<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoLis - Login</title>
    <link rel="stylesheet" href="../CSS/general.css?v=2">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

    <div class="login-card">
        <h2>Welcome back!</h2>
        <p class="subtitle">
            Please enter your details to continue to your dashboard.
        </p>

        <form id="loginForm">
            <div id="savedAccountsField" class="saved-accounts-field" hidden>
                <label for="savedAccounts">Choose a saved account</label>
                <select id="savedAccounts">
                    <option value="">Use another email address</option>
                </select>
            </div>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="name@company.com"
                required
            >

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="**********" required>

            <div class="options">
                <label class="remember"><input type="checkbox">Remember me</label>
                
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" id="loginButton">Sign in</button>
        </form>

        <p class="create-account">Don't have an account?<a href="register.html" id="showRegister">  Create one</a></p>
    </div>

    <script src="../JS/auth.js"></script>
</body>
</html>
